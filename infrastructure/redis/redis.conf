# FraudGuard — Redis configuration (ADR-002: sole hot-path feature store)
#
# This is the ONLY tuning that matters for our access pattern: every key
# we write carries an application-level TTL (windowed counters, cached
# policy, idempotency markers — see docs/architecture/data-model.md and
# ADR-002). There is no category of key we want to keep forever, so a
# blanket eviction policy across the whole keyspace is the right default,
# not a compromise.

# --- Memory ------------------------------------------------------------
# 200mb of data headroom inside a 256m container mem_limit (docker-compose.yml)
# — the gap absorbs Redis's own overhead (connection buffers, replication
# backlog if ever enabled, fragmentation) so an approaching limit shows up
# as eviction metrics, not an OOM-killed container.
maxmemory 200mb

# allkeys-lru rather than volatile-lru: every key we write already carries
# a TTL by design, so the "volatile" vs "allkeys" distinction is moot in
# practice — allkeys-lru is chosen anyway as the more defensive default,
# so a future key added WITHOUT a TTL degrades gracefully (evicted under
# pressure) rather than accumulating unboundedly forever.
maxmemory-policy allkeys-lru

# --- Persistence ---------------------------------------------------------
# Deliberately OFF. Every value Redis holds is DERIVED state — rebuildable
# by replaying Kafka (ADR-002's "Negative consequences" section). Paying
# RDB/AOF disk I/O cost on the hot-path-adjacent process to persist data
# that is disposable by design would be optimising for the wrong property.
save ""
appendonly no

# --- Networking / operational ---------------------------------------------
# Bind to all interfaces inside the container network only — the container
# is never published beyond the Docker network in local dev (no ports
# mapping needed by other services; fraud-api reaches it by service name).
protected-mode no
timeout 0

# --- Slow log --------------------------------------------------------------
# Anything over 5ms is worth seeing — the entire hot-path Redis budget is
# 8ms (ADR-003), so a single slow command consuming most of it belongs in
# this log during Phase 9 bottleneck analysis.
slowlog-log-slower-than 5000
slowlog-max-len 256
